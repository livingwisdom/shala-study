# .github/workflows/deploy.yml -- JRS 2026-07-29
# Builds the PWA and publishes dist/ to GitHub Pages on every push to main.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue rather than cancel: a half-built deploy must never replace a good one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The data is the product here, so a failing test blocks the deploy.
      - run: npm test
      - run: npm run lint

      - name: Build
        # Pages serves a project site from /<repo>/, so the bundle base, the
        # manifest scope and the service worker scope all have to match it.
        # Derived from the repo name so renaming the repo needs no edit here.
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
