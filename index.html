<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Order matters. Safari takes the first rel=icon it sees rather than
         picking by type, and it cannot render an SVG favicon, so the ico goes
         first or Safari shows nothing. Chrome and Firefox read the whole list
         and prefer the SVG regardless of position. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Not black-translucent: that is what draws the page under the status bar
         in the first place, and it forces white status text, which disappears
         on the light theme. "default" lets iOS reserve the bar and tint it from
         theme-color, which adapts. The safe-area padding in index.css stays
         either way, for landscape and the home indicator. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>ytt study</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
